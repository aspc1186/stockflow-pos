<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#061B2A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockFlow" />
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="icon" type="image/svg+xml" href="/stockflow-icon.svg?v=4" />
    <title>StockFlow POS</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#061B2A}
      body{min-height:100vh;min-height:100dvh}
      #stockflow-boot-splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#061B2A;overflow:hidden;transition:opacity .32s ease,visibility .32s ease}
      #stockflow-boot-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
      .sf-boot-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(-2vh)}
      .sf-boot-logo{width:min(48vw,220px);height:auto;filter:drop-shadow(0 12px 30px rgba(0,174,255,.18));animation:sfPulse 1.45s ease-in-out infinite}
      .sf-boot-name{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;font-size:clamp(24px,7vw,38px);letter-spacing:.035em;color:#fff;line-height:1}
      .sf-boot-name span{color:#8DFF16}
      .sf-boot-line{width:150px;height:3px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
      .sf-boot-line:after{content:"";display:block;width:54%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22C4FF,#8DFF16);animation:sfLoad 1.15s ease-in-out infinite}
      @keyframes sfPulse{0%,100%{transform:scale(.96);opacity:.9}50%{transform:scale(1.035);opacity:1}}
      @keyframes sfLoad{0%{transform:translateX(-120%)}100%{transform:translateX(240%)}}
      @media (prefers-reduced-motion:reduce){.sf-boot-logo,.sf-boot-line:after{animation:none}}
    </style>
  </head>
  <body>
    <div id="stockflow-boot-splash" aria-hidden="true">
      <div class="sf-boot-wrap">
        <img class="sf-boot-logo" src="/stockflow-icon.svg?v=4" alt="" />
        <div class="sf-boot-name">STOCK<span>FLOW</span></div>
        <div class="sf-boot-line"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load',function(){
        var splash=document.getElementById('stockflow-boot-splash');
        if(!splash)return;
        window.setTimeout(function(){
          splash.classList.add('hide');
          window.setTimeout(function(){splash.remove()},360);
        },1250);
      });
    </script>
  </body>
</html>
